<head>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body id="back">
    <header>
        <h1>Основы веб-технологий лабораторная работа №2</h1>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>

                <li><a href="auth.html">Вход</a></li>
            </ul>
        </nav>
    </header>

    <div class="contact-form">
        <h2>Форма обратной связи</h2>
        <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
            <label for="name">ФИО:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Как вы узнали о нас</label>
            <label><input type="radio" name="source" value="от знакомых" required> От знакомых</label>
            <label><input type="radio" name="source" value="реклама"> Реклама</label>
            <label><input type="radio" name="source" value="из интернета"> Из интернета</label>
            <label><input type="radio" name="source" value="нашел(ла) случайно"> Нашел(ла) случайно</label>

            <label for="type">Тип обращения:</label>
            <select id="type" name="type" required>
                <option value="жалоба">Жалоба</option>
                <option value="предложение">Предложение</option>
            </select>

            <label for="message">Комментарий:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <label for="file">Прикрепленные файлы:</label>
            <input type="file" id="file" name="file">

            <label><input type="checkbox" name="consent" required> Даю согласие на обработку персональных данных</label>

            <button type="submit">Отправить</button>
        </form>
    </div>
</body>

</html>
